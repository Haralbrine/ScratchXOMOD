<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurboWarp Embed with Custom Buttons</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
  #buttonPanel { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
  .btn { padding: 10px 20px; font-size: 16px; cursor: grab; border-radius: 6px; border: 1px solid #333; background: #f0f0f0; user-select: none; }
  .btn.dragging { opacity: 0.5; }
  #addButton { margin-top: 20px; }
</style>
</head>
<body>

<h2>TurboWarp Project</h2>

<!-- TurboWarp Embed -->
<div id="app" style="width:480px; margin:auto;"></div>

<!-- Button Panel -->
<div id="buttonPanel"></div>

<!-- Add Button -->
<input type="text" id="newButtonName" placeholder="Button name">
<select id="actionType">
  <option value="play">Play</option>
  <option value="stop">Stop</option>
  <option value="restart">Restart</option>
  <option value="broadcast">Broadcast</option>
</select>
<input type="text" id="broadcastName" placeholder="Broadcast name (if needed)">
<button id="addButton">Add Button</button>

<script src="js/vendors~addon-settings~credits~editor~embed~fullscreen~player.js"></script>
<script src="js/vendors~editor~embed~fullscreen~player.js"></script>
<script src="js/editor~embed~fullscreen~player.js"></script>
<script src="js/embed.js"></script>

<script>
const panel = document.getElementById('buttonPanel');
const addBtn = document.getElementById('addButton');
const nameInput = document.getElementById('newButtonName');
const actionSelect = document.getElementById('actionType');
const broadcastInput = document.getElementById('broadcastName');

// Load saved buttons from cookie
let buttons = JSON.parse(getCookie('buttons') || '[]');

// Function to get iframe
function getIframe() { return document.querySelector('#app iframe'); }

// Function to save buttons
function saveButtons() { setCookie('buttons', JSON.stringify(buttons), 365); }

// Render buttons
function renderButtons() {
  panel.innerHTML = '';
  buttons.forEach((btn, index) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = btn.name;
    b.draggable = true;
    b.addEventListener('click', () => handleAction(btn));
    
    // Drag & drop for rearranging
    b.addEventListener('dragstart', e => { b.classList.add('dragging'); e.dataTransfer.setData('text/plain', index); });
    b.addEventListener('dragend', () => { b.classList.remove('dragging'); saveButtons(); });

    b.addEventListener('dragover', e => e.preventDefault());
    b.addEventListener('drop', e => {
      e.preventDefault();
      const from = e.dataTransfer.getData('text/plain');
      const to = index;
      const moved = buttons.splice(from, 1)[0];
      buttons.splice(to, 0, moved);
      renderButtons();
      saveButtons();
    });

    panel.appendChild(b);
  });
}

// Handle button action
function handleAction(btn) {
  const iframe = getIframe();
  if (!iframe) return;
  switch(btn.action){
    case 'play': iframe.contentWindow.postMessage({ method: 'play' }, '*'); break;
    case 'stop': iframe.contentWindow.postMessage({ method: 'stop' }, '*'); break;
    case 'restart': 
      iframe.contentWindow.postMessage({ method: 'stop' }, '*');
      setTimeout(() => iframe.contentWindow.postMessage({ method: 'play' }, '*'), 100);
      break;
    case 'broadcast': 
      if (btn.broadcast) iframe.contentWindow.postMessage({ method: 'broadcast', broadcast: btn.broadcast }, '*');
      break;
  }
}

// Add new button
addBtn.addEventListener('click', () => {
  const name = nameInput.value.trim();
  const action = actionSelect.value;
  const broadcast = broadcastInput.value.trim();
  if (!name) return;
  buttons.push({ name, action, broadcast });
  renderButtons();
  saveButtons();
  nameInput.value = '';
  broadcastInput.value = '';
});

// Initial render
renderButtons();

// Cookie helpers
function setCookie(name, value, days) {
  const d = new Date();
  d.setTime(d.getTime() + (days*24*60*60*1000));
  document.cookie = name + "=" + value + ";path=/;expires=" + d.toUTCString();
}
function getCookie(name) {
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}
</script>

</body>
</html>
